# DocMind Nginx 反向代理配置
# 放置到 /etc/nginx/sites-available/docmind 并创建软链到 sites-enabled，
# 然后 `nginx -t && systemctl reload nginx`
server {
    listen 80;
    server_name docmind.example.com; # 改成你的域名

    client_max_body_size 20m; # 文档上传大小上限

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 关键：关闭代理缓冲，保证 AI 流式输出逐字返回
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
