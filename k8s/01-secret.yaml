# 敏感配置放 Secret，请勿提交真实密钥到 git。
# 生产环境建议用 kubeseal / External Secrets / 云厂商密钥管理。
apiVersion: v1
kind: Secret
metadata:
  name: docmind-secret
  namespace: docmind
type: Opaque
stringData:
  # 数据库连接串（docmind-db 为下方 Postgres Service 的 DNS 名）
  DATABASE_URL: "postgresql://docmind:docmind@docmind-db:5432/docmind?schema=public"
  # 生成方式：openssl rand -base64 32
  AUTH_SECRET: "CHANGE-ME-openssl-rand-base64-32"
  # AI 密钥
  AI_API_KEY: "your-ai-api-key"
