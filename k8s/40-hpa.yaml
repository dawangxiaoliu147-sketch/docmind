# 水平自动伸缩：根据 CPU 使用率自动增减副本数（需要 metrics-server）。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docmind-app-hpa
  namespace: docmind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: docmind-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
