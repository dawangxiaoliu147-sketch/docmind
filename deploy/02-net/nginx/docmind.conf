# ============================================================
# DocMind · Nginx 反向代理（宿主机 nginx，不是容器）
#
# 放置：
#   sudo cp docmind.conf /etc/nginx/sites-available/docmind
#   sudo ln -sf /etc/nginx/sites-available/docmind /etc/nginx/sites-enabled/docmind
#   sudo nginx -t && sudo systemctl reload nginx
#
# 它接手的事：公网只暴露 80/443，应用退到 127.0.0.1:3000 后面。
# ============================================================

# ---------- HTTP ----------
server {
    listen 80;
    listen [::]:80;

    # ⚠️ 换成你的域名。没有域名就先写服务器 IP —— 但**强烈建议弄个域名再上 HTTPS**：
    #    当前 IP + 明文 HTTP 的部署方式，让 crypto.randomUUID()、navigator.clipboard
    #    这些只在安全上下文可用的 API 全部 undefined（项目里已经因此踩过两次坑）。
    server_name <你的域名或 39.105.158.60>;

    # 文档上传上限（与 docker-compose 里的 client_max_body_size 对齐）
    client_max_body_size 20m;

    # 上传解析 + AI 流式回答都可能很久
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    # HTTP 直接反代。配好证书后，把这一段换成下面的「301 跳 HTTPS」版本。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE 升级
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 【关键】关掉代理缓冲，否则 AI 回答不会逐字返回，而是攒完一次性吐出来
        proxy_buffering off;
        proxy_cache off;
    }

    # 健康检查不写访问日志，免得把日志刷满
    location = /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
    }
}

# ============================================================
# 上了域名和证书之后（`certbot --nginx -d 你的域名` 会自动生成下面这段，
# 也会自动把上面的 80 段改成 301 跳转）。手工版本长这样：
# ============================================================
