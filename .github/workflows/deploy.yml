name: 构建并发布镜像

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DATABASE_URL: postgresql://docmind:docmind@127.0.0.1:5432/docmind?schema=public

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # 冒烟测试要真连一个数据库：运行层的 @prisma/client 是 standalone 追踪出来的，
    # 少了它只会在"登录之后的页面"报 500 —— 不接数据库根本测不出来。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: docmind
          POSTGRES_DB: docmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docmind -d docmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先构建到本机、不推送 —— 镜像得真的跑起来，才允许发布。
      # 为什么必须加：运行层从「整包 node_modules」换成了 standalone 产物，
      # 而 standalone 靠依赖追踪挑文件，漏一个就是容器起来 500；
      # 线上从 GHCR 拉一次镜像要十几分钟，用线上试错的代价太高。
      - name: 构建（不推送）
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: docmind-smoke:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 跑一次数据库迁移（验证 prisma CLI + schema + 连通性）
        run: |
          set -e
          docker run --rm --network host \
            -e DATABASE_URL="${{ env.DATABASE_URL }}" \
            docmind-smoke:latest migrate

      - name: 冒烟测试（容器能起来 + 数据库真的能用）
        run: |
          set -e
          docker run -d --name smoke --network host \
            -e DATABASE_URL="${{ env.DATABASE_URL }}" \
            -e AUTH_SECRET="smoke-test-only-secret-not-used-anywhere-else" \
            docmind-smoke:latest

          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3000/login || true)
            echo "  第 $i 次：/login -> ${code:-无响应}"
            [ "$code" = "200" ] && { ok=1; break; }
            sleep 2
          done

          echo "=== 容器日志 ==="
          docker logs smoke 2>&1 | tail -30 || true

          if [ "$ok" != "1" ]; then
            echo "::error::容器没能正常响应 /login（standalone 产物可能缺文件）"
            exit 1
          fi

          echo "=== 健康检查 ==="
          curl -s -o /dev/null -w '  /api/health -> %{http_code}\n' --max-time 10 http://127.0.0.1:3000/api/health

          echo "=== 数据库探针 ==="
          echo "  /s/<不存在> 是公开页面但要走 Prisma：404=客户端正常，500=standalone 漏了 @prisma/client"
          s=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://127.0.0.1:3000/s/smoke-not-exist || true)
          echo "  /s/smoke-not-exist -> $s"
          if [ "$s" != "404" ]; then
            echo "::error::运行时 Prisma 客户端不工作（期望 404，实到 $s）"
            docker logs smoke 2>&1 | tail -40 || true
            exit 1
          fi

          docker rm -f smoke

      - name: 推送（冒烟测试通过后才允许）
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
