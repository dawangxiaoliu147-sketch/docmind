name: 构建并发布镜像

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DATABASE_URL: postgresql://docmind:docmind@127.0.0.1:5432/docmind?schema=public

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 失败时要把诊断信息推到 ci-debug 分支
      packages: write

    # 冒烟测试要真连一个数据库：要验证的不只是"容器能起来"，
    # 还有"运行时的 Prisma 客户端真的能查库"（少了它只会在登录之后的页面 500）。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: docmind
          POSTGRES_DB: docmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docmind -d docmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建（不推送）
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: docmind-smoke:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 跑一次数据库迁移
        run: |
          set -e
          docker run --name migrate-smoke --network host \
            -e DATABASE_URL="${{ env.DATABASE_URL }}" \
            docmind-smoke:latest migrate
          docker rm migrate-smoke

      - name: 冒烟测试（容器能起来 + 数据库真的能用）
        run: |
          set -e
          docker run -d --name smoke --network host \
            -e DATABASE_URL="${{ env.DATABASE_URL }}" \
            -e AUTH_SECRET="smoke-test-only-secret-not-used-anywhere-else" \
            docmind-smoke:latest

          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3000/login || true)
            echo "  第 $i 次：/login -> ${code:-无响应}"
            [ "$code" = "200" ] && { ok=1; break; }
            sleep 2
          done

          echo "=== 容器日志 ==="
          docker logs smoke 2>&1 | tail -30 || true

          if [ "$ok" != "1" ]; then
            echo "::error::容器没能正常响应 /login"
            exit 1
          fi

          echo "=== 健康检查 ==="
          curl -s -o /dev/null -w '  /api/health -> %{http_code}\n' --max-time 10 http://127.0.0.1:3000/api/health

          echo "=== 数据库探针 ==="
          echo "  /s/<不存在> 是公开页面但要走 Prisma：404=客户端正常，500=运行时缺 @prisma/client"
          s=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://127.0.0.1:3000/s/smoke-not-exist || true)
          echo "  /s/smoke-not-exist -> $s"
          if [ "$s" != "404" ]; then
            echo "::error::运行时 Prisma 客户端不工作（期望 404，实到 $s）"
            exit 1
          fi

          docker rm -f smoke

      # 本机访问不了 GitHub 的 Actions 页面，所以失败时把诊断信息推到分支上，
      # 这样在本地 `git fetch origin ci-debug` 就能看到到底哪里挂了。
      - name: 失败时把诊断信息推到 ci-debug 分支
        if: failure()
        run: |
          set +e
          mkdir -p ci-debug
          {
            echo "# 冒烟测试/构建失败诊断"
            echo
            echo "时间：$(date -u +%FT%TZ)  提交：${{ github.sha }}"
            echo
            echo "## 容器状态"
            docker ps -a
            echo
            echo "## 应用容器日志（最后 200 行）"
            docker logs smoke 2>&1 | tail -200
            echo
            echo "## 迁移容器日志（最后 120 行）"
            docker logs migrate-smoke 2>&1 | tail -120
            echo
            echo "## 镜像里的顶层结构（判断产物是否完整）"
            docker create --name layout docmind-smoke:latest true >/dev/null 2>&1
            docker export layout 2>/dev/null | tar -t 2>/dev/null | head -60
            docker rm -f layout >/dev/null 2>&1
            echo
            echo "## 有没有 server.js / node_modules/next / @prisma"
            docker create --name probe docmind-smoke:latest true >/dev/null 2>&1
            docker export probe 2>/dev/null | tar -t 2>/dev/null | grep -E '^(server\.js|node_modules/next/package\.json|node_modules/@prisma/client/package\.json|app/server\.js)$' | head -20
            docker rm -f probe >/dev/null 2>&1
          } > ci-debug/smoke-failure.md 2>&1 || true

          git config user.name "ci-diagnostics"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci-debug
          git add -f ci-debug
          git commit -m "ci: 冒烟测试失败诊断 $(date -u +%FT%TZ)" || echo "没有可提交的内容"
          git push -f origin ci-debug || echo "推送诊断分支失败"

      - name: 推送（冒烟测试通过后才允许）
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
